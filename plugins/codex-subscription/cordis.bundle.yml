# @yfzhou/dsh-llm-codex-subscription bundle patch — the profile layer shipped
# with the package.
#
# `dsh plugin --profile <name> add @yfzhou/dsh-llm-codex-subscription` mounts it
# automatically: once reconcile sees the package declares dsh.bundle, it adds
# this package to the dsh.profile.bundles stack in the profile's package.json,
# with no need to edit cordis.patch.yml by hand.
#
# Machine-specific settings (a proxy, for example) belong in the
# `llm-codex-subscription:` section of settings.yaml, not in this file.
- insert:
    - id: llm-codex-subscription
      name: '@yfzhou/dsh-llm-codex-subscription'
